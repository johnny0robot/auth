<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Login with Johnny Robot</title>
    <link rel="icon" href="https://github.com/johnny0robot/auth/blob/main/johnny_productions-logo.png?raw=true">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: Roboto, "Google Sans Flex", sans-serif;
        background-color: var(--bg-color);
        color: var(--text-color);
        margin: 0;
        padding: 0;
        transition: background-color 0.2s ease, color 0.2s ease;
      }

      :root {
        color-scheme: light dark;
        --bg-color: #ffffff;
        --text-color: #202124;
        --header-bg: #f1f3f4;
        --elements-bg: #ffffff;
        --card-bg: #ffffff;
        --border-color: #e0e0e0;
        --list-bg: #f8f9fa;
        --accent: #1a73e8;
        --shadow: rgba(0, 0, 0, 0.1);
        --brand-red: #e54c30;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg-color: #202124;
          --text-color: #e8eaed;
          --header-bg: #2d2d30; 
          --elements-bg: #292a2d;
          --card-bg: #292a2d;
          --border-color: #3c4043;
          --list-bg: #35363a;
          --accent: #8ab4f8;
        }

      .div {
        background-color: var(--header-bg);
        border-bottom: 1px solid var(--border-color);
        padding: 15px 30px;
        display: flex;
        align-items: center;
        box-shadow: 0 2px 4px var(--shadow);
        transition: background-color 0.2s ease;    
      }

      button {
  background-color: blue;
  color: white;
  border: none;
  padding: 10px 18px;
  border-radius: 6px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  margin: 6px;
}  
    </style>
  </head>
  <body>
    <div class="div" id="div"></div>
    <script>
      const urlSearch = new URLSearchParams(window.loaction.search);
      const imgUrl = urlSearch.get("imgUrl");
      const redrictUrl = urlSearch.get("redrictUrl");
      const name = urlSearch.get("name");
      document.title = "Login to " + name + " with Johnny Robot";

      document.getElementById("div").innerHTML = `
        <img src="${imgUrl}" alt="logo">
        <h3>Sign in to ${name}</h3>
        <label for="emailInput">Email:</label>
        <input type="email" class="div" id="emailInput">
        <button onclick="next("sendEmail")">Next</button>
      `;

      function next() {
        document.getElementById("div").innerHTML = `
          <img src="${imgUrl}" alt="logo">
          <h3>Sign into ${name}</h3>
          <p>We sent an email to ${document.getElementById("emailInput").value} with the login code.</p>
          <input type="number" class="div" id="code">
          <button onclick="send()">Send</button>
        `;
        const code = Math.floor(Math.random() * 1000000).toString().padStart(6, '0');
        sendStyledEmail(event, `
          <div style="background-color: blue; color: white; border: 2px solid white; border-raduis: 8px; font-family: Roboto, Google Sans Flex;">
            <h3>Your login code is:</h3>
            <p>${code}</p>
          </div>
        `);
      }

      function sendStyledEmail(event, htmlEmail) {
    // 1. Prevent standard form redirect and page reload
    event.preventDefault(); 

    // 2. Extract values from your form input IDs
    const name = document.getElementById('senderName').value;
    const message = document.getElementById('senderMessage').value;
        
    // 4. Set up FormSubmit data object
    const payload = {
        "_subject": "Your Login Code (Johnny Robot)",
        "Email Content Summary": htmlEmail
    };

    // 5. Send data via AJAX Fetch API (Replace with your actual email)
    fetch("https://formsubmit.co", {
        method: "POST",
        headers: { 
            'Content-Type': 'application/json',
            'Accept': 'application/json'
        },
        body: JSON.stringify(payload)
    })
    .then(response => response.json())
    .then(data => {
        if(data.success === "true") {
            event.target.reset(); // Automatically clears all form fields
        } else {
            alert("Error sending. Please verify your deployment settings.");
        }
    })
    .catch(error => {
        console.error('Transmission Error:', error);
        alert("Failed to send. Check your internet connection.");
    });
}

    </script>
  </body>
</html>
